name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; in-progress nicht abbrechen,
# damit ein laufendes Production-Deploy sauber durchläuft.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # npm install toleriert und repariert eine veraltete package-lock.json.
      # Dadurch bricht das Deployment nicht mehr ab, wenn Lovable eine
      # Abhängigkeit ergänzt, bevor die Lockdatei synchronisiert wurde.
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      # npm run build = Vite-Build + Vorrendern aller Seiten + sitemap.xml + 404.html
      # (siehe scripts/prerender.js). Gleicher Befehl wie bei Cloudflare Pages.
      - name: Build (Vite + Vorrendern + Sitemap)
        run: npm run build

      # CNAME für die Custom Domain (fels-coach.de via Cloudflare)
      - name: Write CNAME
        run: echo "fels-coach.de" > dist/CNAME

      # Jekyll-Processing auf GitHub Pages deaktivieren,
      # sonst werden Dateien mit Underscore (_app, _vite) ignoriert.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
